[Settings]
; Sprache der Plugin-Oberflaeche: de, en, ru oder uk (Default: en)
; Erwartet eine passende language_<code>.ini im selben Ordner.
Language=en

; 0 = normale (helle) Darstellung, 1 = Dark Mode
; Aenderung wirkt beim naechsten Oeffnen einer Datei (kein TC-Neustart noetig)
DarkMode=0

; Dark-Mode-Farben als Hex RRGGBB (ohne #). Wenn leer/ungueltig, gelten
; die eingebauten Defaults (Text: gedecktes Senfgelb, Hintergrund: Dunkelgrau).
DarkTextColor=DCB43C
DarkBgColor=1E1E1E
DarkEditBgColor=2D2D2D
