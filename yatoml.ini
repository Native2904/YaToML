[Settings]
; Language of the plugin interface: de, en, ru or uk (default: en)
; Requires a corresponding language_<code>.ini file in the same folder.
Language=en
; 0 = normal (light) display, 1 = Dark Mode
; Change takes effect the next time a file is opened (no need to restart TC)
DarkMode=1
; Dark Mode colours as hex RRGGBB (without #). If empty/invalid,
; the built-in defaults apply (text: muted mustard yellow, background: dark grey).
DarkTextColor=DCB43C
DarkBgColor=1E1E1E
DarkEditBgColor=2D2D2D